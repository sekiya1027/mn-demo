<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>フォロー中 - メンエスなう</title>
<!-- [DEMO] メンエスなう会員のマイページ「フォロー中」。店舗HPのウィジェットから登録した分がここに集まる -->
<style>
  :root{--rose:#f53d7b;--ink:#111827;--sub:#6b7280;--bg:#fff;--el:#f6f7f9;--bdr:#e8eaef;--ok:#10b981}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--bdr)}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
  .bar img{height:22px}
  .me{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);border:1px solid var(--bdr);border-radius:999px;padding:4px 9px}
  .me i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  h1{font-size:18px;margin:0;padding:4px 16px 10px}
  .tabs{display:flex;padding:0 12px}
  .tabs button{flex:1;border:0;background:none;padding:10px 0 11px;font:700 13px/1 inherit;font-family:inherit;color:var(--sub);border-bottom:2px solid transparent;cursor:pointer}
  .tabs button.on{color:var(--rose);border-bottom-color:var(--rose)}
  .tabs button b{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--el);color:var(--sub);font-size:10px;line-height:18px}
  main{padding:12px 12px 100px;max-width:520px;margin:0 auto}
  .app{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:linear-gradient(135deg,#fff0f5,#ffe3ec);border:1px solid #ffd0df;margin-bottom:12px;font-size:12px;line-height:1.5}
  .app b{display:block;font-size:13px}
  .app .ic{width:38px;height:38px;border-radius:10px;background:var(--rose);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .app .ic svg{width:20px;height:20px}
  .app button{margin-left:auto;flex-shrink:0;border:0;border-radius:999px;background:var(--rose);color:#fff;font:700 11px/1 inherit;font-family:inherit;padding:9px 12px}
  .card{display:flex;gap:12px;padding:12px;border:1px solid var(--bdr);border-radius:16px;background:#fff;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .av{width:60px;height:60px;border-radius:50%;object-fit:cover;object-position:center 20%;background:#e5e7eb;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px}
  .av.st{border-radius:14px;background:var(--rose)}
  .mn{flex:1;min-width:0}
  .nm{display:flex;align-items:center;gap:8px}
  .nm b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:3px 7px;border-radius:999px;background:#ecfdf5;color:#059669;white-space:nowrap}
  .pill i{width:6px;height:6px;border-radius:50%;background:#10b981}
  .sub{font-size:12px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row{display:flex;align-items:center;gap:8px;margin-top:9px}
  .row a,.row button{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 12px;border-radius:999px;font:700 12px/1 inherit;font-family:inherit;text-decoration:none;border:1.5px solid var(--bdr);background:#fff;color:var(--ink);cursor:pointer}
  .row a.go{border-color:var(--rose);color:var(--rose)}
  .row .ntf{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--sub)}
  .sw{width:38px;height:22px;border-radius:999px;background:#d1d5db;position:relative;border:0;padding:0;cursor:pointer}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
  .sw.on{background:var(--rose)}.sw.on::after{left:19px}
  .empty{text-align:center;color:var(--sub);font-size:13px;line-height:1.8;padding:44px 20px}
  .empty svg{width:44px;height:44px;margin-bottom:8px}
  nav.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--bdr);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
  nav.bottom a{flex:1;text-align:center;font-size:10px;color:#9ca3af;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav.bottom a svg{width:22px;height:22px}
  nav.bottom a.on{color:var(--rose)}
  .demo{position:fixed;left:8px;bottom:70px;z-index:9;background:rgba(20,22,30,.94);color:#fff;font-size:11px;padding:6px 8px;border-radius:12px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
  .demo b{color:#f9a6a6;font-size:10px;letter-spacing:1px}
  .demo a{color:#fff;text-decoration:none;opacity:.85}
</style>
</head>
<body>
<header>
  <div class="bar"><img src="../static/img/common/logo-light.svg" alt="メンエスなう"><span class="me" id="me"><i></i>ゲスト（この端末）</span></div>
  <h1>フォロー中</h1>
  <div class="tabs">
    <button class="on" data-tab="therapist">セラピスト<b id="c-t">0</b></button>
    <button data-tab="store">お気に入り店舗<b id="c-s">0</b></button>
  </div>
</header>
<main>
  <div class="app">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 19h16"/></svg></div>
    <div><b>WEBアプリで開く</b>ホーム画面に追加すると、推しの出勤をプッシュ通知で受け取れます</div>
    <button type="button" id="a2hs">追加</button>
  </div>
  <div id="list"></div>
</main>
<nav class="bottom">
  <a href="https://men-esthe.co.jp/" target="_blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>ホーム</a>
  <a href="https://men-esthe.co.jp/search/" target="_blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>探す</a>
  <a href="following.html" class="on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>フォロー中</a>
  <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>予約</a>
  <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>マイページ</a>
</nav>
<div class="demo"><b>DEMO</b><a href="../index.html">店舗HPに戻る</a></div>
<script>
(function () {
  var FL = "mn-demo-follows", LOGIN = "mn-demo-login";
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function list() { try { return JSON.parse(localStorage.getItem(FL) || "[]"); } catch (e) { return []; } }
  function save(l) { try { localStorage.setItem(FL, JSON.stringify(l)); } catch (e) {} }
  var how = ""; try { how = localStorage.getItem(LOGIN) || ""; } catch (e) {}
  if (how) document.getElementById("me").innerHTML = "<i></i>" + (how === "line" ? "LINE" : how === "google" ? "Google" : "メール") + " でログイン中";
  var tab = "therapist";
  function render() {
    var all = list();
    var ts = all.filter(function (x) { return x.kind !== "store"; }), ss = all.filter(function (x) { return x.kind === "store"; });
    document.getElementById("c-t").textContent = ts.length; document.getElementById("c-s").textContent = ss.length;
    var items = tab === "store" ? ss : ts;
    var el = document.getElementById("list");
    if (!items.length) {
      el.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg><br>'
        + (tab === "store" ? "お気に入り店舗はまだありません。<br>店舗HPの出勤ウィジェット右上の「お気に入り」から追加できます。" : "フォロー中のセラピストはまだいません。<br>店舗HPのタイムラインや出勤カードの「フォロー」から追加できます。") + '</div>';
      return;
    }
    el.innerHTML = items.map(function (x) {
      var isStore = x.kind === "store";
      var av = x.img && !isStore ? '<img class="av" src="' + esc(x.img) + '" alt="">' : '<div class="av' + (isStore ? " st" : "") + '">' + esc((x.name || "?").charAt(0)) + '</div>';
      var sub = isStore ? esc(x.area) + " ・ 店舗" : esc(x.store) + (x.area ? " ・ " + esc(x.area) : "");
      var pill = !isStore && x.extra ? '<span class="pill"><i></i>' + esc(x.extra.replace(/^本日 /, "本日 ")) + '</span>' : "";
      return '<div class="card">' + av + '<div class="mn"><div class="nm"><b>' + esc(x.name) + '</b>' + pill + '</div><div class="sub">' + sub + '</div>'
        + '<div class="row"><a class="go" href="' + esc(x.back || "#") + '">' + (isStore ? "お店のHPへ" : "出勤・予約を見る") + '</a>'
        + '<button type="button" data-rm="' + esc(x.kind + ":" + x.id) + '">解除</button>'
        + '<span class="ntf">通知<button type="button" class="sw' + (x.notify !== false ? " on" : "") + '" data-ntf="' + esc(x.kind + ":" + x.id) + '"></button></span></div></div></div>';
    }).join("");
  }
  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.addEventListener("click", function () { tab = b.getAttribute("data-tab"); document.querySelectorAll(".tabs button").forEach(function (o) { o.classList.toggle("on", o === b); }); render(); });
  });
  document.getElementById("list").addEventListener("click", function (e) {
    var rm = e.target.closest("[data-rm]"), nt = e.target.closest("[data-ntf]");
    if (rm) { var k = rm.getAttribute("data-rm"); save(list().filter(function (x) { return x.kind + ":" + x.id !== k; })); render(); }
    if (nt) { var k2 = nt.getAttribute("data-ntf"); save(list().map(function (x) { if (x.kind + ":" + x.id === k2) x.notify = x.notify === false; return x; })); render(); }
  });
  document.getElementById("a2hs").addEventListener("click", function () { this.textContent = "共有メニュー → ホーム画面に追加"; this.style.background = "#9ca3af"; });
  render();
})();
</script>
</body>
</html>
